# ===================================================================
#  Construit l'appli Cuisine de CHAQUE restaurant decrit dans clients/.
#  Un fichier clients/<client>.json = une appli a son nom et a son icone.
#
#  Secrets (Settings > Secrets and variables > Actions) :
#    CLE_ANDROID_BASE64  -> la cle de signature (cles-android/anasgrillprint.p12, en base64)
#    CLE_ANDROID_MDP     -> son mot de passe
#    CLE_ANDROID_ALIAS   -> son alias (anasgrillprint)
#  La cle ne doit jamais changer : Android refuse une mise a jour signee
#  par une autre cle.
#
#  A chaque envoi sur main : une release « vN » avec un .apk par client,
#  telechargeable depuis la page Releases du depot.
# ===================================================================
name: Applis Cuisine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.l.outputs.clients }}
    steps:
      - uses: actions/checkout@v5
      - id: l
        run: echo "clients=$(ls clients/*.json | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  construire:
    needs: liste
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJson(needs.liste.outputs.clients) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Le kit Android est deja installe sur les machines GitHub (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verifier les secrets
        env:
          CLE: ${{ secrets.CLE_ANDROID_BASE64 }}
          MDP: ${{ secrets.CLE_ANDROID_MDP }}
          ALIAS: ${{ secrets.CLE_ANDROID_ALIAS }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ] || [ -z "$ALIAS" ]; then
            echo "::error::Secrets de signature manquants (CLE_ANDROID_BASE64, CLE_ANDROID_MDP, CLE_ANDROID_ALIAS)."
            exit 1
          fi

      - name: Lire la fiche du client
        id: c
        run: |
          F=clients/${{ matrix.client }}.json
          echo "nom=$(jq -r .nom $F)" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r .id $F)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .url $F)" >> "$GITHUB_OUTPUT"
          echo "icone=$(jq -r .icone $F)" >> "$GITHUB_OUTPUT"

      # L'icone du client (PNG carre, 512 px) devient l'icone de l'appli.
      - name: Icone
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dossier=app/src/main/res/mipmap-${d%%:*}; mkdir -p "$dossier"
            convert "clients/${{ steps.c.outputs.icone }}" -resize ${d##*:}x${d##*:} "$dossier/ic_launcher.png"
          done

      - name: Cle de signature
        env:
          CLE: ${{ secrets.CLE_ANDROID_BASE64 }}
        run: echo "$CLE" | base64 -d > app/cle.p12

      - name: Construire l'apk
        env:
          MDP: ${{ secrets.CLE_ANDROID_MDP }}
          ALIAS: ${{ secrets.CLE_ANDROID_ALIAS }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -Pclient="${{ matrix.client }}" -Pdepot="${{ github.repository }}" \
            -PappName="${{ steps.c.outputs.nom }}" \
            -PappId="${{ steps.c.outputs.id }}" \
            -PstartUrl="${{ steps.c.outputs.url }}" \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" \
            -PstoreFile=cle.p12 -PstorePassword="$MDP" -PkeyAlias="$ALIAS"
          mkdir -p sortie
          cp app/build/outputs/apk/release/app-release.apk "sortie/${{ matrix.client }}-cuisine.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.client }}
          path: sortie/*.apk

  publier:
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Applis Cuisine v${{ github.run_number }}
          files: sortie/*.apk
          make_latest: true
